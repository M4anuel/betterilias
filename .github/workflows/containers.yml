name: Test and publish container images

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --require-hashes -r requirements-runtime.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 playwright==1.63.0
      - name: Backend tests and launcher syntax
        env:
          APP_ENV: production
          OBSERVABILITY_DIR: /tmp/betterilias-tests/events
          COORDINATION_DIR: /tmp/betterilias-tests/coordination
          LOGS_DIR: /tmp/betterilias-tests/logs
          DIAGNOSTIC_REPORTS_DIR: /tmp/betterilias-tests/reports
          SESSIONS_DIR: /tmp/betterilias-tests/sessions
        run: |
          python -m pytest tests/ -q
          python -c "import ast,pathlib; ast.parse(pathlib.Path('start.py').read_text())"
      - name: Frontend checks
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run check:locales
          npm --prefix frontend run build
          node --test tests/*.test.mjs
      - name: Build images and smoke-test the actual production stack
        run: python scripts/smoke_containers.py --build

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry path
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
        env:
          COMPONENT: ${{ matrix.component }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: publish
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Record deployable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s\n' "${IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

name: Test and publish container images

on:
  push:
    branches-ignore: ['dependabot/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked runtime and test tools
        run: |
          python -m pip install --require-hashes -r requirements-runtime.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 playwright==1.63.0
      - name: Backend tests and launcher syntax
        env:
          APP_ENV: production
          OBSERVABILITY_DIR: /tmp/betterilias-tests/events
          COORDINATION_DIR: /tmp/betterilias-tests/coordination
          LOGS_DIR: /tmp/betterilias-tests/logs
          DIAGNOSTIC_REPORTS_DIR: /tmp/betterilias-tests/reports
          SESSIONS_DIR: /tmp/betterilias-tests/sessions
        run: |
          python -m pytest tests/ -q
          python -c "import ast,pathlib; ast.parse(pathlib.Path('start.py').read_text())"
      - name: Frontend checks
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run check:locales
          npm --prefix frontend run build
          node --test tests/*.test.mjs
      - name: Build images and smoke-test the actual production stack
        run: python scripts/smoke_containers.py --build

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry path
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
        env:
          COMPONENT: ${{ matrix.component }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: publish
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Record deployable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s\n' "${IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

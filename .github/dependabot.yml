version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-tooling:
        patterns: ["docker/*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # The locked pydantic-core has no CPython 3.15 wheel. Revisit with the runtime lock.
      - dependency-name: python
        versions: [">=3.15,<3.16"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns: ["react", "react-dom"]

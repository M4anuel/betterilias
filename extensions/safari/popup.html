<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterIlias Safari Companion</title>
  <link rel="stylesheet" href="popup.css">
  <script src="config.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header><img src="icon48.png" width="40" height="40" alt=""><div><div class="brand"><span>Better</span><span>Ilias</span></div><h1 data-i18n="safari.title"></h1></div></header>
  <main>
    <section class="card" aria-labelledby="connection-title">
      <h2 id="connection-title" data-i18n="safari.connection"></h2>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <p id="user" class="muted" hidden></p>
      <p id="server" class="muted"></p>
      <button id="sync" type="button" class="primary" data-i18n="safari.sync"></button>
      <div class="actions"><button id="login" type="button" data-i18n="safari.login"></button><button id="open" type="button" data-i18n="safari.open"></button></div>
    </section>
    <details id="access-note">
      <summary data-i18n="safari.access"></summary>
      <p data-i18n="safari.access_help"></p><p id="sites" class="sites"></p>
      <button id="grant" type="button" data-i18n="safari.grant"></button>
    </details>
    <form id="preferences" aria-labelledby="preferences-title">
      <h2 id="preferences-title" data-i18n="safari.preferences"></h2>
      <fieldset id="preference-fields"><legend class="sr-only" data-i18n="safari.preferences"></legend>
        <div class="toggle"><input id="automatic" name="automatic" type="checkbox" aria-describedby="automatic-help"><label for="automatic" data-i18n="safari.automatic"></label></div>
        <p id="automatic-help" class="muted" data-i18n="safari.automatic_help"></p>
        <label for="language" data-i18n="safari.language"></label><select id="language" name="language"><option value="de">Deutsch</option><option value="en">English</option></select>
      </fieldset>
      <button type="submit" id="save" data-i18n="safari.save"></button>
    </form>
    <p id="feedback" role="status" aria-live="polite" hidden></p>
  </main>
</body>
</html>
